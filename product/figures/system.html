<!-- 認定申請の添付資料 (様式2 の注 2) のシステム図。auth.ippoan.org の /maker/certification/attachment が読み、
     {機器の名称} を版の付いた名称に、{製作事業者名} を申請者の名称に置き換えて 1 ページに組む (A4 横)。
     script は動かない (ページの CSP)。 -->
<h1>{機器の名称}　システム図（データの流れ）</h1>
<div class="sub">点呼端末から一歩庵点呼サーバへの記録と、運行管理者への通知</div>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#333"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#222;stroke-width:1.6}
    .main{fill:#eef4fb;stroke:#1d4f8c;stroke-width:2}
    .t{font-size:15px;font-weight:700}
    .s{font-size:12px;fill:#333}
    .l{stroke:#333;stroke-width:1.6;fill:none}
    .lb{font-size:11.5px;fill:#1d4f8c}
    .area{fill:none;stroke:#888;stroke-width:1.2;stroke-dasharray:3 3}
  </style>

  <!-- site -->
  <rect class="area" x="10" y="20" width="270" height="420" rx="8"/>
  <text x="24" y="42" class="s">営業所（点呼場所）</text>
  <rect class="main" x="35" y="70" width="220" height="330" rx="6"/>
  <text x="145" y="100" text-anchor="middle" class="t">点呼端末一式</text>
  <text x="50" y="132" class="s">① 指静脈認証・運転免許証</text>
  <text x="66" y="150" class="s">で本人確認</text>
  <text x="50" y="178" class="s">② 体温・血圧の測定</text>
  <text x="50" y="206" class="s">③ 疾病・疲労・睡眠不足等</text>
  <text x="66" y="224" class="s">の自己申告</text>
  <text x="50" y="252" class="s">④ 日常点検の結果入力</text>
  <text x="50" y="280" class="s">⑤ アルコール検知器で測定</text>
  <text x="66" y="298" class="s">（静止画・動画を記録）</text>
  <text x="50" y="326" class="s">⑥ 判定結果・指示事項の表示</text>
  <text x="66" y="344" class="s">と運転者の確認</text>
  <text x="50" y="372" class="s">⑦ 監視カメラで全身を録画</text>

  <!-- cloud -->
  <rect class="area" x="340" y="20" width="370" height="420" rx="8"/>
  <text x="354" y="42" class="s">一歩庵点呼サーバ（クラウド）</text>
  <rect class="box" x="370" y="60" width="310" height="66" rx="6"/>
  <text x="525" y="88" text-anchor="middle" class="t">認証</text>
  <text x="525" y="110" text-anchor="middle" class="s">端末の署名と、運転者・管理者の本人確認</text>
  <rect class="box" x="370" y="146" width="310" height="66" rx="6"/>
  <text x="525" y="174" text-anchor="middle" class="t">点呼処理・判定</text>
  <text x="525" y="196" text-anchor="middle" class="s">測定値と申告を基準と照合し、乗務の可否を判定</text>
  <rect class="box" x="370" y="232" width="310" height="80" rx="6"/>
  <text x="525" y="260" text-anchor="middle" class="t">点呼記録の保存</text>
  <text x="525" y="282" text-anchor="middle" class="s">日時・運転者・測定値・判定・静止画/動画・指示事項</text>
  <text x="525" y="300" text-anchor="middle" class="s">改ざんできない形で 1 年以上保存</text>
  <rect class="box" x="370" y="332" width="310" height="66" rx="6"/>
  <text x="525" y="360" text-anchor="middle" class="t">通知</text>
  <text x="525" y="382" text-anchor="middle" class="s">基準外・異常・未実施を運行管理者へ直ちに通知</text>
  <line class="l" x1="525" y1="126" x2="525" y2="146" marker-end="url(#b)"/>
  <line class="l" x1="525" y1="212" x2="525" y2="232" marker-end="url(#b)"/>
  <line class="l" x1="525" y1="312" x2="525" y2="332" marker-end="url(#b)"/>

  <line class="l" x1="255" y1="180" x2="370" y2="180" marker-end="url(#b)" marker-start="url(#b)"/>
  <text x="312" y="170" text-anchor="middle" class="lb">HTTPS</text>
  <text x="312" y="198" text-anchor="middle" class="s">測定値・映像</text>
  <text x="312" y="214" text-anchor="middle" class="s">判定・指示</text>

  <!-- manager -->
  <rect class="area" x="770" y="20" width="220" height="420" rx="8"/>
  <text x="784" y="42" class="s">運行管理者</text>
  <rect class="box" x="790" y="150" width="180" height="90" rx="6"/>
  <text x="880" y="180" text-anchor="middle" class="t">管理画面</text>
  <text x="880" y="202" text-anchor="middle" class="s">点呼記録の確認・出力</text>
  <text x="880" y="220" text-anchor="middle" class="s">（PC・スマートフォン）</text>
  <rect class="box" x="790" y="320" width="180" height="90" rx="6"/>
  <text x="880" y="350" text-anchor="middle" class="t">通知の受信</text>
  <text x="880" y="372" text-anchor="middle" class="s">異常時に連絡を受け、</text>
  <text x="880" y="390" text-anchor="middle" class="s">運転者へ対応を指示</text>
  <line class="l" x1="680" y1="272" x2="790" y2="200" marker-end="url(#b)" marker-start="url(#b)"/>
  <text x="735" y="226" text-anchor="middle" class="lb">HTTPS</text>
  <line class="l" x1="680" y1="365" x2="790" y2="365" marker-end="url(#b)"/>

  <text x="500" y="480" text-anchor="middle" class="s">業務後の点呼も同じ流れで、本人確認・アルコール測定・運行と車両の状況の申告を記録する。</text>
</svg>
<div class="note">
・通信はすべて暗号化（HTTPS）。点呼端末は制御装置の署名で認証し、登録されていない端末からの記録は受け付けない。<br>
・点呼記録は追記のみで、保存後に変更・削除できない。<br>
・監視カメラの録画から点呼の時間帯を切り出し、点呼記録と結び付けて保存する。運行管理者は点呼の様子を管理画面で確かめられる。
</div>
